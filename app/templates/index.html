<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Wireless Threat Detection SOC
    </title>

    <link rel="stylesheet"
          href="/static/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="container">

        <h1>
            Wireless Threat Detection SOC
        </h1>

        <div class="stats-grid">

            <div class="stat-card">

                <h3>Last Scan</h3>

                <p id="last-scan">
                    Never
                </p>

            </div>

            <div class="stat-card">

                <h3>Total Networks</h3>

                <p id="total-networks">0</p>

            </div>

            <div class="stat-card">

                <h3>Total Alerts</h3>

                <p id="total-alerts">0</p>

            </div>

            <div class="stat-card">

                <h3>Critical Alerts</h3>

                <p id="critical-alerts">0</p>

            </div>

            <div class="stat-card">

                <h3>Duplicate SSIDs</h3>

                <p id="duplicate-ssids">0</p>

            </div>

        </div>

        <div class="chart-container">

            <canvas id="severityChart">

            </canvas>

        </div>

        <div class="chart-container">

            <canvas id="trendChart">

            </canvas>

        </div>

        <button onclick="runScan()">
            Run Wireless Scan
        </button>

        <div class="filter-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search SSID..."
            >

            <select id="severityFilter">

                <option value="">
                    All Severities
                </option>

                <option value="critical">
                    Critical
                </option>

                <option value="high">
                    High
                </option>

                <option value="medium">
                    Medium
                </option>

                <option value="low">
                    Low
                </option>

            </select>

        </div>

        <h2>
            Alerts
        </h2>

        <div id="alerts-container">

        </div>

        <div id="investigationModal"
            class="modal">

            <div class="modal-content">

                <span class="close-button"
                    onclick="closeModal()">

                    &times;

                </span>

                <div id="modalBody">

                </div>

            </div>

    </div>

    </div>

    <script>

        let allAlerts = []

        const socket = new WebSocket(

            "ws://127.0.0.1:8000/ws"
        )
        socket.onmessage = function(event) {

            const data =
                JSON.parse(event.data)

            if (
                data.type === "new_alert"
            ) {

                console.log(
                    "New Alert Received",
                    data.alert
                )

                loadAlerts()

                loadStats()

                loadSeverityChart()

                loadTrendChart()
            }
        }

        let severityChart = null
        let trendChart = null

        async function runScan() {

            const response =
                await fetch("/scan")

            const data =
                await response.json()

            loadAlerts()
            loadStats()
            loadSeverityChart()
            loadTrendChart()
            document.getElementById(
                "last-scan"
            ).innerText =
                new Date().toLocaleTimeString()
        }


        async function loadAlerts() {

            const response =
                await fetch("/alerts")

            const data =
                await response.json()

            
            allAlerts = data.alerts

            renderAlerts(allAlerts)}

            function renderAlerts(alerts) {

                const container =
                    document.getElementById(
                        "alerts-container"
                    )

                container.innerHTML = ""


                alerts.forEach(alert => {

                    container.innerHTML += `

                        <div class="
                            alert-card
                            ${alert.severity}
                        "
                        
                        onclick='openInvestigation(
                            ${JSON.stringify(alert)}
                        )'>

                            <h3>
                                ${alert.alert_type}
                            </h3>

                            <p>
                                <strong>SSID:</strong>
                                ${alert.ssid}
                            </p>

                            <p>
                                <strong>Severity:</strong>
                                ${alert.severity}
                            </p>

                            <p>

                                <strong>Status:</strong>

                                <span class="
                                    status-badge
                                    ${alert.status}
                                ">

                                    ${alert.status}

                                </span>

                            </p>

                            <p>
                                <strong>Threat Score:</strong>
                                ${alert.threat_score}
                            </p>

                            <p>
                                <strong>Timestamp:</strong>
                                ${alert.timestamp}
                            </p>

                            <div class="alert-actions">

                                <button
                                    onclick="
                                        updateAlertStatus(
                                            ${alert.id},
                                            'investigating'
                                        )
                                    "
                                >

                                    Investigate

                                </button>

                                <button
                                    onclick="
                                        updateAlertStatus(
                                            ${alert.id},
                                            'resolved'
                                        )
                                    "
                                >

                                    Resolve

                                </button>

                                <button
                                    onclick="
                                        updateAlertStatus(
                                            ${alert.id},
                                            'false_positive'
                                        )
                                    "
                                >

                                    False Positive

                                </button>

                            </div>

                            <p>
                                ${alert.message}
                            </p>

                        </div>
                    `
                })
            }
        
        function openInvestigation(alert) {

            const modal =
                document.getElementById(
                    "investigationModal"
                )

            const body =
                document.getElementById(
                    "modalBody"
                )

            let detailsHTML = ""

            if (
                alert.details
                &&
                alert.details.length > 0
            ) {

                alert.details.forEach(net => {

                    detailsHTML += `

                        <div class="network-detail">

                            <p>
                                <strong>BSSID:</strong>
                                ${net.bssid}
                            </p>

                            <p>
                                <strong>Signal:</strong>
                                ${net.signal}
                            </p>

                            <p>
                                <strong>Channel:</strong>
                                ${net.channel}
                            </p>

                            <p>
                                <strong>Authentication:</strong>
                                ${net.authentication}
                            </p>

                        </div>
                    `
                })
            }

            body.innerHTML = `

                <h2>${alert.alert_type}</h2>

                <p>
                    <strong>SSID:</strong>
                    ${alert.ssid}
                </p>

                <p>
                    <strong>Severity:</strong>
                    ${alert.severity}
                </p>

                <p>
                    <strong>Threat Score:</strong>
                    ${alert.threat_score}
                </p>

                <p>
                    ${alert.message}
                </p>

                <hr>

                <h3>
                    Related Networks
                </h3>

                ${detailsHTML}
            `

            modal.style.display = "block"
        }


        function closeModal() {

            document.getElementById(
                "investigationModal"
            ).style.display = "none"
        }

        function applyFilters() {

            const searchText =
                document.getElementById(
                    "searchInput"
                ).value.toLowerCase()

            const severity =
                document.getElementById(
                    "severityFilter"
                ).value


            const filteredAlerts =
                allAlerts.filter(alert => {

                    const matchesSearch =

                        alert.ssid
                            .toLowerCase()
                            .includes(searchText)

                    const matchesSeverity =

                        severity === ""
                        ||
                        alert.severity === severity

                    return (
                        matchesSearch
                        &&
                        matchesSeverity
                    )
                })

            renderAlerts(filteredAlerts)
        }

        async function updateAlertStatus(

            alertId,

            status

        ) {

            await fetch(

                `/alerts/${alertId}/status?status=${status}`,

                {
                    method: "POST"
                }
            )

            loadAlerts()

            loadStats()

            loadSeverityChart()

            loadTrendChart()
        }

        async function loadStats() {

            const response =
                await fetch("/stats")

            const stats =
                await response.json()

            document.getElementById(
                "total-networks"
            ).innerText =
                stats.total_networks

            document.getElementById(
                "total-alerts"
            ).innerText =
                stats.total_alerts

            document.getElementById(
                "critical-alerts"
            ).innerText =
                stats.critical_alerts

            document.getElementById(
                "duplicate-ssids"
            ).innerText =
                stats.duplicate_ssids
        }

        async function loadSeverityChart() {

            const response =
                await fetch("/severity-data")

            const data =
                await response.json()

            const ctx =
                document.getElementById(
                    "severityChart"
                )

            if (severityChart) {

                severityChart.destroy()
            }

            severityChart = new Chart(ctx, {

                type: "doughnut",

                data: {

                    labels: [
                        "Critical",
                        "High",
                        "Medium",
                        "Low"
                    ],

                    datasets: [{

                        data: [

                            data.critical,

                            data.high,

                            data.medium,

                            data.low
                        ],

                        backgroundColor: [

                            "#ef4444",

                            "#f97316",

                            "#eab308",

                            "#3b82f6"
                        ]
                    }]
                }
            })
        }

        async function loadTrendChart() {

            const response =
                await fetch("/trend-data")

            const data =
                await response.json()

            const labels =
                data.history.map(
                    item => item.timestamp
                )

            const alertCounts =
                data.history.map(
                    item => item.alerts_generated
                )

            const ctx =
                document.getElementById(
                    "trendChart"
                )

            if (trendChart) {

                trendChart.destroy()
            }

            trendChart = new Chart(ctx, {

                type: "line",

                data: {

                    labels: labels,

                    datasets: [{

                        label: "Alerts Generated",

                        data: alertCounts,

                        borderColor: "#60a5fa",

                        backgroundColor:
                            "rgba(96,165,250,0.2)",

                        tension: 0.3
                    }]
                }
            })
        }

        loadAlerts()
        loadStats()
        loadSeverityChart()
        loadTrendChart()
       

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            applyFilters
        )

        document.getElementById(
            "severityFilter"
        ).addEventListener(
            "change",
            applyFilters
        )

    </script>

</body>

</html>
