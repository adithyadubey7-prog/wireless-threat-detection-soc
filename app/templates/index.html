<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Wireless Threat Detection SOC
    </title>

    <link rel="stylesheet"
          href="/static/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">

            <h2>
                Wireless SOC
            </h2>

            <p class="status-live">
                ● Live Monitoring
            </p>

            <button onclick="runScan()">

                Run Scan

            </button>

        </aside>


        <main class="main-content">

            <header class="topbar">

                <h1>
                    Wireless Threat Detection
                </h1>

            </header>


            <section class="stats-grid">

                <div class="stat-card">

                    <h3>
                        Last Scan
                    </h3>

                    <p id="last-scan">

                        --:--:--

                    </p>

                </div>

                <div class="stat-card">

                    <h3>Total Networks</h3>

                    <p id="total-networks">0</p>

                </div>

                <div class="stat-card">

                    <h3>Total Alerts</h3>

                    <p id="total-alerts">0</p>

                </div>

                <div class="stat-card">

                    <h3>Critical Alerts</h3>

                    <p id="critical-alerts">0</p>

                </div>

                <div class="stat-card">

                    <h3>Duplicate SSIDs</h3>

                    <p id="duplicate-ssids">0</p>

                </div>

            </section>


            <section class="charts-grid">

                <div class="chart-card">

                    <h3>
                        Severity Distribution
                    </h3>

                    <div class="chart-wrapper">

                        <canvas id="severityChart">

                        </canvas>

                    </div>

                </div>

                <div class="chart-card">

                    <h3>
                        Alert Trends
                    </h3>

                    <div class="chart-wrapper">

                        <canvas id="trendChart">

                        </canvas>

                    </div>

                </div>

            </section>


            <section class="alerts-section">

                <div class="alerts-header">

                    <h2>
                        Threat Alerts
                    </h2>

                    <div class="filter-bar">

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search SSID..."
                        >

                        <select id="severityFilter">

                            <option value="">
                                All Severities
                            </option>

                            <option value="critical">
                                Critical
                            </option>

                            <option value="high">
                                High
                            </option>

                            <option value="medium">
                                Medium
                            </option>

                            <option value="low">
                                Low
                            </option>

                        </select>

                    </div>

                </div>

                <div id="alerts-container">

                </div>

            </section>

        </main>

    </div>

    <div id="investigationModal"
        class="modal">

        <div class="modal-content">

            <span class="close-button"
                onclick="closeModal()">

                &times;

            </span>

            <div id="modalBody">

            </div>

        </div>

    </div>

    <script>

    let allAlerts = []

    let severityChart = null

    let trendChart = null


    const socket = new WebSocket(

        "ws://127.0.0.1:8000/ws"
    )


    socket.onmessage = function(event) {

        const data =
            JSON.parse(event.data)

        if (
            data.type === "new_alert"
        ) {

            loadAlerts()

            loadStats()

            loadSeverityChart()

            loadTrendChart()
        }
    }


    async function loadAlerts() {

        const response =
            await fetch("/alerts")

        const data =
            await response.json()

        allAlerts = data.alerts

        renderAlerts(allAlerts)
    }


    function renderAlerts(alerts) {

        const container =
            document.getElementById(
                "alerts-container"
            )

        container.innerHTML = ""


        alerts.forEach(alert => {

            container.innerHTML += `

                <div class="
                    alert-card
                    ${alert.severity}
                "

                onclick='openInvestigation(
                    ${JSON.stringify(alert)}
                )'
                >

                    <h3>
                        ${alert.alert_type}
                    </h3>

                    <p>
                        <strong>SSID:</strong>
                        ${alert.ssid}
                    </p>

                    <p>
                        <strong>Severity:</strong>
                        ${alert.severity}
                    </p>

                    <p>

                        <strong>Status:</strong>

                        <span class="
                            status-badge
                            ${alert.status}
                        ">

                            ${alert.status}

                        </span>

                    </p>

                    <p>
                        <strong>Threat Score:</strong>
                        ${alert.threat_score}
                    </p>

                    <p>
                        <strong>Timestamp:</strong>
                        ${alert.timestamp}
                    </p>

                    <p>
                        ${alert.message}
                    </p>

                    <div class="alert-actions">

                        <button
                            onclick="
                                event.stopPropagation()

                                updateAlertStatus(
                                    ${alert.id},
                                    'investigating'
                                )
                            "
                        >

                            Investigate

                        </button>

                        <button
                            onclick="
                                event.stopPropagation()

                                updateAlertStatus(
                                    ${alert.id},
                                    'resolved'
                                )
                            "
                        >

                            Resolve

                        </button>

                        <button
                            onclick="
                                event.stopPropagation()

                                updateAlertStatus(
                                    ${alert.id},
                                    'false_positive'
                                )
                            "
                        >

                            False Positive

                        </button>

                    </div>

                </div>
            `
        })
    }


    async function loadStats() {

        const response =
            await fetch("/stats")

        const data =
            await response.json()

        document.getElementById(
            "last-scan"
        ).innerText =
            data.last_scan

        document.getElementById(
            "total-networks"
        ).innerText =
            data.total_networks

        document.getElementById(
            "total-alerts"
        ).innerText =
            data.total_alerts

        document.getElementById(
            "critical-alerts"
        ).innerText =
            data.critical_alerts

        document.getElementById(
            "duplicate-ssids"
        ).innerText =
            data.duplicate_ssids
    }


    async function loadSeverityChart() {

        const response =
            await fetch("/severity-data")

        const data =
            await response.json()


        const ctx =
            document.getElementById(
                "severityChart"
            )


        if (severityChart) {

            severityChart.destroy()
        }


        severityChart = new Chart(ctx, {

            type: "pie",

            data: {

                labels: data.labels,

                datasets: [{

                    data: data.values,

                    backgroundColor: [

                        "#ef4444",

                        "#f97316",

                        "#eab308",

                        "#3b82f6"
                    ],

                    borderWidth: 1
                }]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        position: "top",

                        labels: {

                            color: "white"
                        }
                    }
                }
            }
        })
    }

    async function loadTrendChart() {

        const response =
            await fetch("/trend-data")

        const data =
            await response.json()

        const labels =
            data.history.map(
                item => item.timestamp
            )

        const alertCounts =
            data.history.map(
                item => item.alerts_generated
            )

        const ctx =
            document.getElementById(
                "trendChart"
            )

        if (trendChart) {

            trendChart.destroy()
        }

        trendChart = new Chart(ctx, {

            type: "line",

            data: {

                labels: labels,

                datasets: [{

                    label:
                        "Alerts Generated",

                    data: alertCounts
                }]
            },

            options: {

                responsive: true,

                maintainAspectRatio: false,

                plugins: {

                    legend: {

                        labels: {

                            color: "white"
                        }
                    }
                },

                scales: {

                    x: {

                        ticks: {

                            color: "white"
                        }
                    },

                    y: {

                        ticks: {

                            color: "white"
                        }
                    }
                }
            }
        })
    }


    function applyFilters() {

        const searchText =
            document.getElementById(
                "searchInput"
            ).value.toLowerCase()

        const severity =
            document.getElementById(
                "severityFilter"
            ).value


        const filteredAlerts =
            allAlerts.filter(alert => {

                const matchesSearch =

                    alert.ssid
                        .toLowerCase()
                        .includes(searchText)

                const matchesSeverity =

                    severity === ""
                    ||
                    alert.severity === severity

                return (
                    matchesSearch
                    &&
                    matchesSeverity
                )
            })

        renderAlerts(filteredAlerts)
    }


    async function updateAlertStatus(

        alertId,

        status

    ) {

        await fetch(

            `/alerts/${alertId}/status?status=${status}`,

            {
                method: "POST"
            }
        )

        loadAlerts()

        loadStats()

        loadSeverityChart()

        loadTrendChart()
    }


    function openInvestigation(alert) {

        const modal =
            document.getElementById(
                "investigationModal"
            )

        const body =
            document.getElementById(
                "modalBody"
            )

        body.innerHTML = `

            <h2>
                ${alert.alert_type}
            </h2>

            <p>
                <strong>SSID:</strong>
                ${alert.ssid}
            </p>

            <p>
                <strong>Severity:</strong>
                ${alert.severity}
            </p>

            <p>
                <strong>Threat Score:</strong>
                ${alert.threat_score}
            </p>

            <p>
                ${alert.message}
            </p>
        `

        modal.style.display = "block"
    }


    function closeModal() {

        document.getElementById(
            "investigationModal"
        ).style.display = "none"
    }


    async function runScan() {

        await fetch("/scan")
    }


    window.onload = () => {

        loadAlerts()

        loadStats()

        loadSeverityChart()

        loadTrendChart()


        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            applyFilters
        )

        document.getElementById(
            "severityFilter"
        ).addEventListener(
            "change",
            applyFilters
        )
    }

    </script>

</body>

</html>
